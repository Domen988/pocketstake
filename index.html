<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pegged</title>
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="header">
    <span id="header-title">Pegged</span>
    <span id="net-dot" class="dot" title="online"></span>
    <button id="btn-help" class="icon-btn" aria-label="help">?</button>
  </header>

  <main id="main">
    <section id="screen-map" class="screen active">
      <canvas id="map-canvas"></canvas>
      <div id="acc-readout" class="overlay-chip">–</div>
      <div id="scale-bar" class="overlay-chip"><span id="scale-line"></span><span id="scale-text"></span></div>
      <div class="map-buttons">
        <button id="btn-search" class="round-btn" aria-label="search">⌕</button>
        <button id="btn-recentre" class="round-btn" aria-label="re-centre">◎</button>
      </div>
      <div id="card" class="sheet hidden"></div>
      <div id="search-panel" class="sheet hidden"></div>
      <div id="toast" class="toast hidden"></div>
    </section>

    <section id="screen-measure" class="screen">
      <p class="placeholder" data-i18n="measure.soon"></p>
    </section>

    <section id="screen-log" class="screen">
      <p class="placeholder" data-i18n="log.soon"></p>
    </section>

    <section id="screen-settings" class="screen">
      <div id="settings-root"></div>
    </section>
  </main>

  <nav id="tabbar">
    <button class="tab active" data-screen="map" data-i18n="tab.map"></button>
    <button class="tab" data-screen="measure" data-i18n="tab.measure"></button>
    <button class="tab" data-screen="log" data-i18n="tab.log"></button>
    <button class="tab" data-screen="settings" data-i18n="tab.settings"></button>
  </nav>

  <div id="welcome" class="fullscreen hidden"></div>

  <script src="vendor/proj4.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
